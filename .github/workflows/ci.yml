name: CI

on:
  push:
    branches: [main]
    # A chart-only push has no Go or Node to build; helm-lint.yml covers it.
    paths-ignore:
      - 'charts/**'
      - 'deploy/**'
      - 'docs/**'
      - '**/*.md'

# One run per ref at a time; the superseded one is cancelled.
#
# On a private repository every job-minute of a run nobody will read is still
# billed. Pushing twice in a minute used to pay for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go build, vet, lint & test
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.13.2"
          working-directory: backend

  frontend:
    name: Next.js build & lint
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
