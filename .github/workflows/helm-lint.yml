name: Helm lint

# Chart-only. A frontend or backend push must not pay for a Helm job -- see the
# concurrency note in ci.yml for why job-minutes are worth filtering here.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-lint:
    name: helm lint & template
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add metrics-server repo
        run: helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/

      # `build`, not `update`: it honours the digest pinned in the tracked
      # Chart.lock instead of silently re-resolving it.
      - name: Build dependencies
        run: helm dependency build charts/kubeadjust

      - name: Lint (strict)
        run: helm lint charts/kubeadjust --strict

      - name: Smoke test — default
        run: helm template kubeadjust charts/kubeadjust > /dev/null

      - name: Smoke test — OIDC
        run: |
          helm template kubeadjust charts/kubeadjust \
            --set oidc.enabled=true \
            --set oidc.clientId=test \
            --set oidc.clientSecret=test \
            --set oidc.issuerUrl=https://example.com \
            --set oidc.sessionSecret=test > /dev/null

      - name: Smoke test — multi-cluster
        run: |
          helm template kubeadjust charts/kubeadjust \
            --set 'backend.clusters.prod=https://k8s.prod.example.com:6443' > /dev/null

      - name: Smoke test — Ingress + TLS
        run: |
          helm template kubeadjust charts/kubeadjust \
            --set ingress.enabled=true \
            --set ingress.tls[0].secretName=tls-secret \
            --set "ingress.tls[0].hosts[0]=kubeadjust.example.com" > /dev/null

      - name: Smoke test — Prometheus + NetworkPolicy
        run: |
          helm template kubeadjust charts/kubeadjust \
            --set prometheus.enabled=true \
            --set networkPolicy.enabled=true > /dev/null
